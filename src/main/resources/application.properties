# ====================================================================================
# DEFAULT PROFILE - connects to PostgreSQL
#
# Spring Boot reads this file automatically. Property names follow a convention:
#   spring.datasource.*    -> configures the database connection
#   spring.jpa.*           -> configures Hibernate (the JPA implementation)
#   spring.flyway.*        -> configures Flyway migrations
#   app.*                  -> our own custom properties (see JwtProperties.java)
#
# Override any property with an environment variable:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://prod-host:5432/taskflow  java -jar taskflow.jar
# ====================================================================================

spring.application.name=TaskFlow

# --- DATABASE (PostgreSQL by default) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA / HIBERNATE ---
# "validate" = Hibernate checks that the entity classes match the database schema (created by Flyway)
# but does NOT modify the schema itself. This is the safest option for production.
# (Other options: "none", "update", "create", "create-drop" - avoid in production!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Show SQL in the console during development (turn off in production for performance)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY ---
spring.flyway.enabled=true

# --- JWT (our custom properties, bound via @ConfigurationProperties in JwtProperties.java) ---
# In production, this secret MUST be injected via the APP_JWT_SECRET environment variable.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- SWAGGER / SPRINGDOC ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- SERVER ---
server.port=8080
