# ====================================================================================
# H2 PROFILE - run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
# SPRING PROFILES let you swap configuration per environment. This file is ONLY loaded
# when the "h2" profile is active. It overrides the datasource from application.properties
# so the app starts with an in-memory H2 database (no PostgreSQL needed).
#
# H2 runs in PostgreSQL compatibility mode ("MODE=PostgreSQL") so our Flyway SQL works as-is.
# ====================================================================================

spring.datasource.url=jdbc:h2:mem:taskflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 has a built-in web console for browsing the database: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway needs to know this is H2, not PostgreSQL
spring.flyway.enabled=true
