# ====================================================================================
# TEST PROFILE - automatically activated by @SpringBootTest / @ActiveProfiles("test")
#
# Uses H2 in-memory so tests are fast, repeatable, and don't need a running database.
# ====================================================================================

spring.datasource.url=jdbc:h2:mem:taskflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1vbmx5LW5vdC1wcm9kdWN0aW9u
app.jwt.expiration-ms=3600000
